# values.yaml

replicaCount: 1

image:
  repository: inneobr/meteored
  tag: latest
  pullPolicy: Always

env:
  DATABASE_HOSTNAME: ""
  DATABASE_USERNAME: ""
  DATABASE_PASSWORD: ""
  GROQ_API_KEY:      ""

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "250m"
    memory: "128Mi"
